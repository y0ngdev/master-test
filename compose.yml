services:

  app:
    container_name: masteringx-app
    image: nginx:alpine
    restart: always # Automatically restart unless the service is explicitly stopped
    volumes:
      - app-storage:/var/www/html/storage:ro # Mount the storage volume as read-only
      - app-public-assets:/var/www/html/public:ro
      - './docker/prod/nginx/conf.d/nginx.conf:/etc/nginx/conf.d/default.conf'
    networks:
      - app-production
    env_file:
      - .env
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - php-fpm

  php-fpm:
    container_name: masteringx-php-fpm
    image: masteringx-fpm
    build:
      context: .
      dockerfile: ./docker/prod/masteringx/Dockerfile
      target: production # Use the 'production' stage in the Dockerfile
    restart: unless-stopped
    volumes:
      - app-public-assets:/var/www/html/public  # Mount built public assets to ensure the manifest.json and hashed files match between Nginx and PHP-FPM
      - app-storage:/var/www/html/storage       # Mount the storage volume
    env_file:
      - .env
    networks:
      - app-production
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_HOST: '%'
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-production
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
  queue:
    image: masteringx-fpm
    container_name: masteringx-queue
    depends_on:
      - mysql
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - app-storage:/var/www/html/storage
      - app-public-assets:/var/www/html/public
    networks:
      - app-production
    environment:
      CONTAINER_ROLE: queue
    command: php artisan queue:work --verbose --tries=3 --timeout=120
   
volumes:
  app-public-assets:
  app-storage:
  mysql-data:

networks:
  app-production:
